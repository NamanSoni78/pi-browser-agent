<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e1842" />
      <stop offset="60%" stop-color="#0f0c23" />
      <stop offset="100%" stop-color="#080613" />
    </radialGradient>

    <!-- Browser Ring / Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="45%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Pi Core Gradient -->
    <linearGradient id="piGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fbcfe8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glowing Eye Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Compass Needle Gradient -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Intense Glow Filter for Agent Node -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Subtle Outer Border -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- ================= BROWSER / COMPASS FRAMEWORK ================= -->
  <!-- Ambient Orbit Behind -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="32" />

  <!-- Agent Sensory Ring / Browser Web -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#orbitGrad)" stroke-width="6" stroke-dasharray="14 10 4 10" opacity="0.65" />

  <!-- Outer Browser Ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Navigation / Compass Reticle Ticks (Browser Navigation) -->
  <g stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" stroke-linecap="round">
    <line x1="256" y1="46" x2="256" y2="58" />
    <line x1="256" y1="454" x2="256" y2="466" />
    <line x1="46" y1="256" x2="58" y2="256" />
    <line x1="454" y1="256" x2="466" y2="256" />
  </g>

  <!-- ================= BROWSER CHROME (TOP BAR) ================= -->
  <g transform="translate(196, 88)">
    <rect x="-30" y="-12" width="120" height="24" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <circle cx="-16" cy="0" r="3.5" fill="#ef4444" opacity="0.8" />
    <circle cx="-4" cy="0" r="3.5" fill="#eab308" opacity="0.8" />
    <circle cx="8" cy="0" r="3.5" fill="#22c55e" opacity="0.8" />
    <!-- Mini URL indicator line -->
    <line x1="22" y1="0" x2="76" y2="0" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ================= AGENT / PI SYMBOL ================= -->
  <g filter="url(#glow)">
    <!-- Pi Horizontal Roof (Curved, Aerodynamic bar) -->
    <path d="M 132 188 C 170 178, 220 174, 256 174 C 292 174, 342 178, 380 188 C 388 190, 394 182, 390 174 C 382 158, 360 148, 332 148 C 290 148, 222 148, 180 148 C 146 148, 122 160, 122 176 C 122 184, 126 190, 132 188 Z" 
          fill="url(#piGrad)" />

    <!-- Left Leg: Autonomous Flow Stem (terminating in dynamic curve) -->
    <path d="M 186 178 C 188 220, 186 280, 168 334 C 158 362, 142 374, 128 376 C 120 377, 116 368, 122 362 C 140 344, 152 306, 154 260 C 156 220, 156 182, 156 178 Z" 
          fill="url(#piGrad)" />

    <!-- Right Leg: Cybernetically Grounded with Rightward Tail Hook -->
    <path d="M 314 178 L 314 316 C 314 346, 324 366, 350 366 C 368 366, 384 354, 392 342 C 396 336, 404 340, 400 346 C 388 368, 362 384, 336 384 C 294 384, 282 350, 282 312 L 282 178 Z" 
          fill="url(#piGrad)" />
  </g>

  <!-- ================= AGENT "EYE" / INTELLIGENCE CORE ================= -->
  <!-- Sensory Aperture between the legs of Pi -->
  <g transform="translate(256, 262)" filter="url(#intenseGlow)">
    <!-- Cyan Glowing Core -->
    <circle cx="0" cy="0" r="22" fill="#0369a1" opacity="0.4" />
    <circle cx="0" cy="0" r="14" fill="url(#eyeGrad)" />
    <circle cx="0" cy="0" r="6" fill="#f0f9ff" />
    
    <!-- Pulse Ring -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 4" />
  </g>

  <!-- ================= ORBITING AUTONOMOUS AGENT NODES ================= -->
  <!-- Target Pointer / Autonomous Action Bead (Top Right) -->
  <g transform="translate(378, 134)" filter="url(#intenseGlow)">
    <circle cx="0" cy="0" r="8" fill="#f43f5e" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <!-- Directional Ping -->
    <path d="M 0 -14 L 0 -18 M 10 -10 L 14 -14 M 14 0 L 18 0" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Passive Data Bead (Bottom Left) -->
  <circle cx="134" cy="378" r="5" fill="#38bdf8" filter="url(#glow)" />
</svg>
